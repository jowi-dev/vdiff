[package]
name = "vdiff"
version = "0.1.0"
edition = "2021"

[lib]
name = "vdiff"
path = "src/lib.rs"

[[bin]]
name = "vdiff"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
eframe = "0.36.1"
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["syntect"] }
git2 = "0.21.0"
imara-diff = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3.0.3", features = ["full", "visit"] }
thiserror = "2.0.20"
tree-sitter = "0.26.12"
tree-sitter-elixir = "0.3.5"

[dev-dependencies]
tempfile = "3.27.0"
