[package]
name = "vdiff"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Visual PR review: a branch's change set as a layered dependency graph, with vim navigation and a real embedded Neovim"
repository = "https://github.com/jowi-dev/vdiff"

[lib]
name = "vdiff"
path = "src/lib.rs"

[[bin]]
name = "vdiff"
path = "src/main.rs"

[features]
default = ["gui"]
# The egui/eframe GUI. On by default; `--no-default-features` builds the
# headless CLI only (`--dump`, `--export-comments`, `--publish-comments`),
# with no egui/eframe/syntect in the dependency tree at all. See
# `src/main.rs`'s `launch_gui` for the headless-build error path.
gui = ["egui", "eframe", "egui_extras"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
eframe = { version = "0.36.1", optional = true }
egui = { version = "0.36.1", optional = true }
# `syntect` (source highlighting) is reachable only through this crate's
# `syntax_highlighting` module, gated behind `gui` -- not a direct
# dependency of vdiff. Issue #16 will add it directly for the TUI.
egui_extras = { version = "0.36.1", features = ["syntect"], optional = true }
git2 = "0.21.0"
imara-diff = "0.2.0"
rmpv = "1.3"
which = "6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3.0.3", features = ["full", "visit"] }
thiserror = "2.0.20"
toml = "0.9"
tree-sitter = "0.26.12"
tree-sitter-elixir = "0.3.5"

[dev-dependencies]
tempfile = "3.27.0"
